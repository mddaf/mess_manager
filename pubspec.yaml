name: mess_manager
description: "A shared meal and grocery tracking app for hostels, flats, and student messes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  google_sign_in: ^6.2.2

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^17.4.0

  # Data Visualization
  fl_chart: ^1.2.0

  # Media & OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.16.0

  # Networking & Utils
  http: ^1.3.0
  intl: ^0.20.2
  shared_preferences: ^2.3.5

  # UI Styling & Micro-animations
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^3.2.5
  json_serializable: ^6.9.4

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
