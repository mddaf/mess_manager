<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mess Manager - Shared meal and grocery tracking for hostels, flats, and student messes.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mess Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mess Manager (মেস ম্যানেজার)</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121612;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #ffffff;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
    }
    .logo-icon {
      font-size: 52px;
      margin-bottom: 12px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    .app-title {
      font-size: 22px;
      font-weight: bold;
      color: #81C784;
      margin-bottom: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto;
      border: 3px solid rgba(129, 199, 132, 0.2);
      border-radius: 50%;
      border-top-color: #81C784;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="logo-icon">🍲</div>
    <div class="app-title">Mess Manager</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
