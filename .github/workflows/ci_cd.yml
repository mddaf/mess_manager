name: CI/CD Pipeline & Build Artifacts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # 🧪 JOB 1: Regression Checks & Code Analysis (CI)
  # -------------------------------------------------------------
  analyze_and_test:
    name: 🧪 Analyze & Test (Regression Check)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Generate Localizations & Code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: 🔍 Static Code Analysis
        run: flutter analyze

      - name: 🧪 Run Unit & Widget Tests
        run: flutter test

  # -------------------------------------------------------------
  # 🤖 JOB 2: Build Android Release APK (Artifact)
  # -------------------------------------------------------------
  build_android:
    name: 🤖 Build Android APK Artifact
    needs: analyze_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Generate Localizations & Code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: 🛠️ Build Android Release APK
        run: flutter build apk --release

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # -------------------------------------------------------------
  # 🌐 JOB 3: Build Web Release Bundle (Artifact)
  # -------------------------------------------------------------
  build_web:
    name: 🌐 Build Web Bundle Artifact
    needs: analyze_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Generate Localizations & Code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: 🛠️ Build Web Release Bundle
        run: flutter build web --release

      - name: 📤 Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-web-release
          path: build/web/
          retention-days: 30
