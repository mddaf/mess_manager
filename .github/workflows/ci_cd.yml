name: CI/CD Pipeline & Android APK Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 🧪 JOB 1: Regression Checks & Code Analysis (CI)
  # -------------------------------------------------------------
  analyze_and_test:
    name: 🧪 Analyze & Test (Regression Check)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Generate Localizations & Code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: 🔍 Static Code Analysis (Regression Check)
        run: flutter analyze

      - name: 🧪 Run Unit & Widget Tests
        run: flutter test

  # -------------------------------------------------------------
  # 🤖 JOB 2: Build Android Release APK & Publish Release (CD)
  # -------------------------------------------------------------
  build_android:
    name: 🤖 Build & Publish Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Generate Localizations
        run: flutter gen-l10n

      - name: 🛠️ Build Android Release APK
        run: flutter build apk --release

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Meal Manager ${{ github.ref_name }}
          body: |
            ## 📱 Meal Manager Android Release (${{ github.ref_name }})

            ### ✨ Key Features Included:
            - **🍱 Real-Time Meal Check-in**: Synchronized breakfast, lunch, dinner toggles across flatmates.
            - **🛒 Grocery Expense Logging & OCR**: Smart receipt scanner with Google ML Kit text extraction.
            - **💵 Cash & Bank Deposit Records**: Track member contributions automatically.
            - **📊 Automated Settlement Calculations**: Meal rate formula and balance tracking.
            - **🔄 Manager Rotation & Admin Controls**: Rotate manager role or manage members seamlessly.

            ---
            🌐 **Live Web Version**: [https://meal-manager-844f5.web.app](https://meal-manager-844f5.web.app)
          files: build/app/outputs/flutter-apk/app-release.apk

  # -------------------------------------------------------------
  # 🌐 JOB 3: Build Web Release (CD)
  # -------------------------------------------------------------
  build_web:
    name: 🌐 Build Web Bundle
    needs: analyze_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Generate Localizations
        run: flutter gen-l10n

      - name: 🛠️ Build Web Release Bundle
        run: flutter build web --release

      - name: 📤 Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-web-release
          path: build/web/
          retention-days: 30
