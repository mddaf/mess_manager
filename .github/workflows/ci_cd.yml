name: CI/CD Pipeline & Android Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 🧪 JOB 1: Regression, Unit & Static Analysis Checks
  # -------------------------------------------------------------
  analyze_and_test:
    name: 🧪 Analysis, Unit & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Generate Localizations & Code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: 🔍 Static Code Analysis
        run: flutter analyze

      - name: 🧪 Run Unit, OCR & Regression Tests
        run: flutter test

  # -------------------------------------------------------------
  # 🤖 JOB 2: Build Android Release APK & Web Bundle (Single Build)
  # -------------------------------------------------------------
  build_artifacts:
    name: 🛠️ Build APK & Web Release Bundles
    needs: analyze_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Generate Localizations & Code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: 🛠️ Build Android Release APK
        run: flutter build apk --release

      - name: 🛠️ Build Web Release Bundle
        run: flutter build web --release

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-web-release
          path: build/web/
          retention-days: 30

  # -------------------------------------------------------------
  # 🚀 JOB 3: Publish GitHub Release (Only on Tag Push or Manual Trigger)
  # -------------------------------------------------------------
  publish_release:
    name: 🚀 Publish GitHub Release
    needs: build_artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: mess-manager-android-release
          path: build/app/outputs/flutter-apk/

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Meal Manager ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🍱 Meal Manager Release (${{ github.ref_name }})

            ### ✨ Key Features Included:
            - **🍱 Real-Time Meal Check-in**: Synchronized breakfast, lunch, dinner toggles across flatmates.
            - **🛒 Grocery Expense Logging & OCR**: Smart receipt scanner with Google ML Kit text extraction (Bangla & English).
            - **💳 Payment Funding Sources**: Mess Fund, Purchaser Pocket, and Split payment tracking.
            - **💵 Cash & Bank Deposit Records**: Track member contributions automatically with dues protection.
            - **📊 Automated Settlement Calculations**: Meal rate formula, carried dues rollover, and archived month history.

            ---
            🌐 **Live Web Version**: [https://meal-manager-844f5.web.app](https://meal-manager-844f5.web.app)
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
